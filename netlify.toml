# 투지: 화면은 빌드 없이 그대로 올리고, 술 사진·AI 설명만 작은 서버 칸(netlify/functions)에서 처리해요
[build]
  command = "mkdir -p site && cp index.html manifest.webmanifest *.png site/"
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 폰이 앱 설치 정보를 정확히 알아보도록 형식 지정
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
